{% extends 'base.html' %}

{% block title %}Forgot Password - Nexus Academy{% endblock %}
{% block meta_description %}Reset your Nexus Academy password.{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Forgot your password?</h2>
            <p class="mt-2 text-gray-600">Enter your email and we'll send you a reset link.</p>
        </div>
        <form class="bg-white p-8 rounded-lg shadow-md space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-nexus-600 hover:bg-nexus-700">
                Send Reset Link
            </button>
        </form>
    </div>
</section>
{% endblock %}
