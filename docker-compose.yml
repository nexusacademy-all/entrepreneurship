name: entrepreneurship

services:
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/nexusacademy-all/entrepreneurship:phase-01-v1
    container_name: entrepreneurship-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /opt/entrepreneurship/media:/app/media
      - /opt/entrepreneurship/staticfiles:/app/staticfiles
      - /opt/entrepreneurship/logs:/app/logs
    ports:
      - "8001:8000"
    networks:
      - entrepreneurship-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--settings=backend.entrepreneurship.settings.production"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: entrepreneurship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-entrepreneurship_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - entrepreneurship_pgdata:/var/lib/postgresql/data
      - /opt/entrepreneurship/backups:/backups
    networks:
      - entrepreneurship-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: entrepreneurship-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - entrepreneurship_redisdata:/data
    networks:
      - entrepreneurship-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: entrepreneurship-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/entrepreneurship/staticfiles:/var/www/static:ro
      - /opt/entrepreneurship/media:/var/www/media:ro
      - /opt/entrepreneurship/logs:/var/log/nginx
    networks:
      - entrepreneurship-net
    depends_on:
      django_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: entrepreneurship-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - entrepreneurship-net
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  entrepreneurship-net:
    driver: bridge

volumes:
  entrepreneurship_pgdata:
  entrepreneurship_redisdata:
